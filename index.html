<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soundbook · Hangul practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f2;color:#232d35;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{border-bottom:1px solid #d5d4cb;background:#fffef9}.bar,main{max-width:1100px;margin:auto;padding:0 32px}.bar{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{font:bold 27px Georgia}.mark{display:inline-grid;place-items:center;background:#254eaa;color:white;transform:rotate(-7deg);font:22px sans-serif;border-radius:4px;margin-right:12px;width:37px;height:37px}button,select{font:inherit;cursor:pointer;color:inherit}button{border:1px solid #cfcec6;background:#fffefa;border-radius:8px;padding:11px 17px}button:hover{filter:brightness(.96)}button:focus-visible,select:focus-visible{outline:3px solid #ffae39}small,.label{font:600 11px/1.6 ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(40px,6vw,66px);margin:7px 0;letter-spacing:-2.5px}main{padding-top:44px;padding-bottom:40px}.intro{color:#5e655f;margin:10px 0 30px}.toolbar,.foot,.panelhead,.tools{display:flex;align-items:center;justify-content:space-between;gap:10px}.toolbar{margin-bottom:16px}.tabs{display:flex;padding:4px;background:#e8e7df;border-radius:10px}.tabs button{background:transparent;border:0}.tabs .on{background:white;box-shadow:0 1px 4px #0002;color:#20489d}select{background:#fffefa;border:1px solid #cfcec6;border-radius:7px;padding:10px}.book{display:grid;grid-template-columns:36% 64%;border:1px solid #c9c8bb;border-radius:15px;overflow:hidden;box-shadow:0 4px 0 -1px #e3e1d6,0 6px 0 -2px #c8c6bb}.prompt{background:#264fa8;color:white;padding:30px;display:flex;flex-direction:column;min-height:385px;background-image:linear-gradient(90deg,#0001,transparent 7px)}.prompt small{color:#d5e1ff}.cue{margin:auto;text-align:center;padding:20px 0}.glyph{font-size:clamp(54px,7vw,88px);line-height:1.25;overflow-wrap:anywhere}.cue p{color:#e0e9ff}.prompt footer{border-top:1px solid #ffffff44;padding-top:13px;font:13px Georgia;font-style:italic}.page{background:#fffef9;padding:26px}.panelhead h2{margin:0;font-size:25px}.pad{margin:20px 0 10px;height:236px;position:relative;border:1px solid #dcdcd2;border-radius:8px;background-color:#fbfaf4;background-image:linear-gradient(#d7d8cc70 1px,transparent 1px),linear-gradient(90deg,#d7d8cc70 1px,transparent 1px);background-size:28px 28px;display:grid;place-items:center;overflow:hidden}#ghost{color:#bbc6dd;font-size:clamp(44px,7vw,86px);text-align:center;overflow-wrap:anywhere;line-height:1.15}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.tools{flex-wrap:wrap;font-size:14px}.tools button{padding:8px 13px}.foot{margin-top:20px}.primary{background:#244da7;color:white;border-color:#244da7}.note{border-top:1px solid #d4d2c7;margin-top:35px;padding-top:16px;color:#656961;font-size:14px}.choices{display:grid;gap:10px;margin-top:18px}.choices button{text-align:left}dialog{max-width:min(580px,94vw);max-height:83vh;border:1px solid #c8c7bd;border-radius:14px;background:#fffef9;padding:25px}dialog::backdrop{background:#17203170}dialog h2{margin:0}.ref{line-height:1.6}.ref b{color:#244da7}label{cursor:pointer}#answer{font-size:15px;color:#325b53}[hidden]{display:none!important}@media(max-width:680px){.bar,main{padding-left:16px;padding-right:16px}.bar{height:60px}main{padding-top:24px}.book{grid-template-columns:1fr}.prompt{min-height:170px;padding:16px 20px}.cue{padding:8px}.cue p{margin:4px}.prompt footer{display:none}.page{padding:17px}.pad{height:200px}.toolbar{align-items:end}.tabs button{padding:10px}.level small{display:none}.intro{margin-bottom:20px}.brand{font-size:23px}.foot{align-items:center}.bar button{padding:9px}}
</style><header><div class="bar"><div class="brand"><span class="mark">ㅎ</span>Soundbook</div><button id="guide">▤ &nbsp; Sound guide</button></div></header><main><small>English sounds / Hangul script</small><h1>Practice notebook</h1><p class="intro">Read the sound. Learn the shape. Write English in Hangul.</p><div class="toolbar"><div class="tabs"><button id="write">✎ &nbsp;Writing</button><button id="read">▤ &nbsp;Reading</button></div><label class="level"><small>Level &nbsp;</small><select id="level" aria-label="Difficulty"><option>Symbols</option><option>Syllables</option><option>Words</option><option>Phrases</option></select></label></div><div class="book"><section class="prompt"><small id="counter"></small><div class="cue"><div class="glyph" id="glyph"></div><p id="hint"></p></div><footer>Soundbook &nbsp; / &nbsp; Phonetic English</footer></section><section class="page"><div class="panelhead"><h2 id="task"></h2><small id="type"></small></div><div id="writing"><div class="pad"><span id="ghost"></span><canvas aria-label="Handwriting practice area"></canvas></div><div class="tools"><label><input type="checkbox" id="trace" checked> Trace guide</label><div><button id="undo">↶ Undo</button> <button id="clear">Clear</button></div></div></div><div class="choices" id="choices"></div><p id="answer" aria-live="polite"></p></section></div><div class="foot"><button id="prev">← Previous</button><button class="primary" id="next">Next card →</button></div><p class="note" id="note"></p></main><dialog id="dialog"><div class="panelhead"><h2>Sound guide</h2><button id="closeGuide">Close</button></div><div class="ref" id="ref"></div></dialog><script>
const $=id=>document.getElementById(id);
const cards=[
[['ㅁ','m','as in moon'],['ㄴ','n','as in noon'],['ㅅ','s','as in see'],['ㅎ','h','as in hi'],['ㄹ','l','as in feel'],['ㅂ','b','as in bee'],['ㅌ','t','as in tea'],['ㅍ','p','as in pea'],['ㅋ','k','as in key'],['ㄷ','d','as in day'],['ㄱ','g','as in go'],['ㅣ','ee','as in see'],['ㅗ','oh','as in go'],['ㅜ','oo','as in moon'],['ㅐ','short a','as in cat'],['ㅔ','eh','as in bed'],['ㅓ','uh','as in sun'],['ㅏ','ah','as in father']],
[['미','mee','ㅁ + ㅣ'],['니','nee','ㄴ + ㅣ'],['모','moh','ㅁ + ㅗ'],['누','noo','ㄴ + ㅜ'],['비','bee','ㅂ + ㅣ'],['하','hah','ㅎ + ㅏ'],['오','oh','ㅇ + ㅗ'],['패','pa (as in pat)','ㅍ + ㅐ']],
[['문','moon','ㅁ + ㅜ + ㄴ'],['노트','note','노 + 트'],['캣','cat','ㅋ + ㅐ + ㅅ'],['선','sun','ㅅ + ㅓ + ㄴ'],['미','me','ㅁ + ㅣ'],['홈','home','ㅎ + ㅗ + ㅁ'],['펜','pen','ㅍ + ㅔ + ㄴ'],['고','go','ㄱ + ㅗ'],['데이','day','데 + 이'],['수운','soon','수 + 운'],['시','see','ㅅ + ㅣ'],['앳','at','ㅇ + ㅐ + ㅅ']],
[['고 홈','go home','go · home'],['시 미','see me','see · me'],['앳 홈','at home','at · home'],['시 미 수운','see me soon','see · me · soon'],['어 펜','a pen','a · pen'],['어 노트','a note','a · note'],['원 데이','one day','one · day'],['고 수운','go soon','go · soon']]];
// Use one block for the vowel in “soon”, as in “moon”.
cards[2][9]=['순','soon','ㅅ + ㅜ + ㄴ'];cards[3][3][0]='시 미 순';cards[3][7][0]='고 순';
let level=0,index=0,reading=false,lines=[],pointer=null;try{const saved=JSON.parse(localStorage.soundbook||'{}');if(cards[saved.level]?.[saved.index])({level,index}=saved);reading=saved.reading===true}catch{}
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d');function draw(){let r=cv.getBoundingClientRect();if(!r.width)return;let d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#193f87';for(const line of lines){ctx.beginPath();ctx.lineWidth=4;line.forEach(([x,y],i)=>i?ctx.lineTo(x*r.width,y*r.height):ctx.moveTo(x*r.width,y*r.height));if(line.length===1){ctx.lineTo(line[0][0]*r.width+.1,line[0][1]*r.height)}ctx.stroke()}}
function point(e){let r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}cv.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;cv.setPointerCapture(pointer);lines.push([point(e)]);draw()};cv.onpointermove=e=>{if(pointer===e.pointerId){lines.at(-1).push(point(e));draw()}};cv.onlostpointercapture=()=>pointer=null;new ResizeObserver(draw).observe(cv);$('clear').onclick=()=>{lines=[];draw()};$('undo').onclick=()=>{lines.pop();draw()};$('trace').onchange=()=>$('ghost').hidden=!$('trace').checked;
function render(){let deck=cards[level],[shape,word,tip]=deck[index];lines=[];pointer=null;$('level').selectedIndex=level;$('write').className=reading?'':'on';$('read').className=reading?'on':'';$('counter').textContent='Practice card   /   '+String(index+1).padStart(2,'0')+' of '+deck.length;$('glyph').textContent=reading?shape:word;$('hint').textContent=reading?'Read this '+['symbol','block','word','phrase'][level]:level===0?tip:'Write the English '+['','syllable','word','phrase'][level];$('ghost').textContent=shape;$('writing').hidden=reading;$('choices').hidden=!reading;$('task').textContent=reading?'Choose the sound':'Writing pad';$('type').textContent=reading?'Recall':'Freehand';$('answer').textContent='';$('choices').replaceChildren();if(reading){let opts=[index,...Array.from({length:deck.length-1},(_,i)=>(index+i+1)%deck.length).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);for(let i of opts){let b=document.createElement('button');b.textContent=deck[i][1];b.onclick=()=>{b.disabled=true;$('answer').textContent=i===index?'Correct · '+tip:'Try another sound.';if(i===index)for(let o of $('choices').children)o.disabled=true};$('choices').append(b)}}$('note').textContent=reading?'Choose the English sound that matches the card.':'Trace with your Pencil or finger. Turn off the guide to write from memory, then reveal it to compare.';draw();try{localStorage.soundbook=JSON.stringify({level,index,reading})}catch{}}
$('level').onchange=e=>{level=e.target.selectedIndex;index=0;render()};$('next').onclick=()=>{index=(index+1)%cards[level].length;render()};$('prev').onclick=()=>{index=(index+cards[level].length-1)%cards[level].length;render()};$('write').onclick=()=>{reading=false;render()};$('read').onclick=()=>{reading=true;render()};$('ref').innerHTML='<p>This notebook uses approximate English sounds for personal notes. Accents differ, and several English sounds can share a Hangul spelling.</p><h3>Build a block</h3><p>Start with a consonant. Put a vertical vowel on its right (ㅁ + ㅣ → 미, “me”) or a horizontal vowel beneath it (ㅁ + ㅜ → 무, “moo”). Tuck a final consonant underneath (무 + ㄴ → 문, “moon”). For a vowel start, use silent ㅇ as in 오.</p><h3>Notebook conventions</h3><p>ㅗ covers the vowel in “go”. Final ㅅ stands for a clipped t in 캣 (“cat”). 트 gives the final t its own block in 노트 (“note”). Read each example back as English, keeping spaces between words.</p><h3>Sound key</h3>'+cards[0].map(([s,w,h])=>'<div><b>'+s+'</b>　'+w+' · '+h+'</div>').join('');$('guide').onclick=()=>$('dialog').showModal();$('closeGuide').onclick=()=>$('dialog').close();render()
</script></html>
